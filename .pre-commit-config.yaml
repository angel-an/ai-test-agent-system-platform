repos:
  - repo: local
    hooks:
      - id: check-stdlib-conflicts
        name: Check Python stdlib naming conflicts
        entry: python backend/scripts/check_stdlib_conflicts.py backend/app --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: check-compiler-rev
        name: Check COMPILER_REV bumped when executor template/logic changed
        entry: python backend/scripts/check_compiler_rev.py --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # F811：同名定义静默覆盖（曾实锤两起：test_run_repo 同名方法、
      # coverage_review_tools 同名 tool 覆盖平台函数 import）。
      # 只启这一条规则，不引入全量风格检查。
      - id: ruff-f811
        name: Ruff F811 (redefinition of unused name)
        # 用 python -m ruff 而非裸 ruff.exe 相对路径：Windows 下 pre-commit 以
        # CreateProcess 拉起钩子进程，相对路径 exe 会 WinError 2（2026-10-28 实测）。
        # python 走 PATH 解析，venv 激活与否都能工作（系统 Python 亦装有 ruff）。
        entry: python -m ruff check backend/app --select F811 --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
