# pytest.ini - 仓库根级 pytest 配置
# 确保从任何子目录运行 pytest 都能加载正确配置
[pytest]
testpaths = tests backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Python path
pythonpath = backend

# 采集排除（修复 `cd backend && pytest` 的收集错误）
#
# 根因链：
#   1) testpaths 是**相对调用目录**解析的。`cd backend` 后，第二项 `backend/tests`
#      指向不存在的 backend/backend/tests；
#   2) 有 testpath 不存在时，pytest 回退为扫描 CWD（backend/）；
#   3) 本项目的 `python_files = test_*.py` 与大量**领域源模块同名**
#      （app/models/test_case.py、app/api/v2/test_runs.py、
#        app/agents/*/tools/test_artifacts_tools.py …），
#      回退扫描会把这些源码当测试导入，其中 3 个导入失败 →
#      "Interrupted: 3 errors during collection"；
#      另有 backend/workspace/** 的 agent 运行时草稿（含模块级 sys.exit(0)）→ INTERNALERROR。
#
# 因此排除源树与运行时工作区。注意：pytest 的 norecursedirs 按目录 basename 匹配。
# 这两个目录都不是测试源（testpaths 只含 tests 与 backend/tests），排除不影响正常采集。
norecursedirs = node_modules .git .venv .next .pytest_cache __pycache__ .npm-cache
    app
    workspace

# 异步测试模式（自动）
asyncio_mode = auto
# 异步测试中使用同步 fixture（tmp_path 等）所需的 loop scope
asyncio_default_fixture_loop_scope = function

# 标记
markers =
    slow: 慢速测试
    smoke: 冒烟测试
    regression: 回归测试

# 控制台输出
addopts = -v --tb=short --strict-markers

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
