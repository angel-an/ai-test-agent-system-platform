# pytest.ini - 仓库根级 pytest 配置
# 确保从任何子目录运行 pytest 都能加载正确配置
[pytest]
testpaths = tests backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Python path
pythonpath = backend

# 异步测试模式（自动）
asyncio_mode = auto
# 异步测试中使用同步 fixture（tmp_path 等）所需的 loop scope
asyncio_default_fixture_loop_scope = function

# 标记
markers =
    slow: 慢速测试
    smoke: 冒烟测试
    regression: 回归测试

# 控制台输出
addopts = -v --tb=short --strict-markers

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
